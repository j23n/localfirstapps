[workspace]
resolver = "2"
members = [
    "localcore-blob",
    "localcore-conflict",
    "localcore-id",
    "localcore-log",
    "localcore-queue",
    "localcore-vfs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
