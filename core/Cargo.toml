[workspace]
resolver = "2"
members = [
    "contacts-core",
    "contacts-ffi",
    "localcore-blob",
    "localcore-conflict",
    "localcore-geo",
    "localcore-id",
    "localcore-log",
    "localcore-queue",
    "localcore-vfs",
    "localcore-walk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# default-features = false: no cargo-metadata in a crate that may ship.
uniffi = { version = "0.32.0", default-features = false }
