[workspace]
resolver = "2"
members = [
    "contacts-core",
    "contacts-ffi",
    "health-core",
    "health-ffi",
    "localcore-blob",
    "localcore-conflict",
    "localcore-id",
    "localcore-log",
    "localcore-queue",
    "localcore-trace",
    "localcore-ui",
    "localcore-vfs",
    "localcore-walk",
    "music-core",
    "music-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# default-features = false: no cargo-metadata in a crate that may ship.
uniffi = { version = "0.32.0", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "registry",
    "std",
] }
