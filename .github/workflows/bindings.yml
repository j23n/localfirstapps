# Phase 0.4: UniFFI Swift is committed. This job regenerates it and fails
# on drift. A second job type-checks the same Swift against a Linux .so.
name: Bindings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.97.1"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  drift:
    name: bindings drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: "1.97.1"

      - name: OS dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev

      - name: Regenerate UniFFI Swift
        working-directory: apps/gallery
        run: ./scripts/generate_bindings.sh

      - name: Fail on drift
        run: |
          git add -N apps/gallery/LocalGallery/GalleryCore.swift \
                     apps/gallery/LocalGallery/GalleryCoreFFI.h \
                     apps/gallery/linux/swift-shim/Sources/GalleryFFICheck/GalleryCore.swift \
                     apps/gallery/linux/swift-shim/CGalleryCoreFFI/GalleryCoreFFI.h \
                     apps/gallery/linux/swift-shim/CGalleryCoreFFI/module.modulemap
          if ! git diff --exit-code -- \
                apps/gallery/LocalGallery/GalleryCore.swift \
                apps/gallery/LocalGallery/GalleryCoreFFI.h \
                apps/gallery/linux/swift-shim/Sources/GalleryFFICheck/GalleryCore.swift \
                apps/gallery/linux/swift-shim/CGalleryCoreFFI/GalleryCoreFFI.h \
                apps/gallery/linux/swift-shim/CGalleryCoreFFI/module.modulemap; then
            echo "UniFFI bindings drifted. Run apps/gallery/scripts/generate_bindings.sh and commit." >&2
            exit 1
          fi

  linux-swift:
    name: linux swift shim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: "1.97.1"

      - name: OS dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev

      - name: Swift
        uses: swift-actions/setup-swift@34e3d27dcea462441b3b7094961a83c85cd28b18 # v2
        with:
          swift-version: "6.0"

      - name: swift build against libgallery_ffi.so
        working-directory: apps/gallery
        run: ./linux/swift-shim/build.sh
