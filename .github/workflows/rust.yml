# Crate gate: cargo test for localcore-* and gallery crates.
# App shells (gallery Linux/iOS, contacts, music, health log) are
# `.github/workflows/apps.yml`. The 20k generated-library e2e is
# local-only (`apps/gallery/scripts/e2e_20k.sh`); it is not a workflow.
name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.97.1"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  localcore:
    name: localcore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: "1.97.1"

      - name: OS dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential

      - name: cargo test --locked --workspace
        working-directory: core
        run: cargo test --locked --workspace --all-targets 2>&1 | tee "${GITHUB_WORKSPACE}/localcore-test.log"

      - name: Upload cargo test logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: localcore-test-logs
          path: localcore-test.log
          if-no-files-found: warn
          retention-days: 7

  gallery-core:
    name: gallery-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: "1.97.1"

      - name: OS dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev

      - name: cargo test --locked --workspace
        working-directory: apps/gallery/core
        run: cargo test --locked --workspace --all-targets 2>&1 | tee "${GITHUB_WORKSPACE}/gallery-core-test.log"

      - name: Upload cargo test logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gallery-core-test-logs
          path: gallery-core-test.log
          if-no-files-found: warn
          retention-days: 7
