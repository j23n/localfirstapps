# Phase 0.5: ADR 0002 R13 graph check. Starts red (gallery-geo → ureq).
# --expect-violations keeps CI mergeable while asserting that exact red
# so a new networking crate cannot hide behind the known one.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  graph:
    name: "ADR 0002 R13 graph (red: gallery-geo)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/graph/check.py --self-test

      - name: Graph check (expected red)
        run: python3 conformance/graph/check.py --expect-violations gallery-geo
