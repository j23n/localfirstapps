# Graph check (ADR 0002 R13, green after localcore-geo), Milestone A
# source greps (no FileProvider / MetricKit in production Swift/Go),
# ADR 0007 R16 review controls, semantic debt baseline, ADR 0003 R6
# (still red: gallery-ffi domain Records), ADR 0004 R14 generated drift,
# ADR 0004 R11 colour literals in GTK shells, and
# shell-kit-swift's Linux-checkable package boundaries.
name: Conformance

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  graph:
    name: "ADR 0002 R13 graph"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/graph/check.py --self-test

      - name: Graph check
        run: python3 conformance/graph/check.py

  source:
    name: "Milestone A source greps"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/source/check.py --self-test

      - name: Production Swift/Go APIs
        run: python3 conformance/source/check.py

  review-control:
    name: "ADR 0007 R16 review controls"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/r16/check.py --self-test

      - name: Checklist and pull request template
        run: python3 conformance/r16/check.py

  semantic:
    name: "Semantic debt baseline"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/semantic/check.py --self-test

      - name: Production semantic conformance
        run: python3 conformance/semantic/check.py

  r6:
    name: "ADR 0003 R6 record inventory"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/r6/check.py --self-test

      - name: Gallery Record inventory is green
        run: python3 conformance/r6/check.py

      - name: contacts-ffi Record inventory is green
        run: python3 conformance/r6/check.py --src core/contacts-ffi/src

      - name: music-ffi Record inventory is green
        run: python3 conformance/r6/check.py --src core/music-ffi/src

  r14:
    name: "ADR 0004 R14 generated sources"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Regenerating produces no diff
        run: python3 scripts/gen_r14.py --check

      - name: Accent-fg contrast table
        run: python3 scripts/test_gen_r14.py

  colour:
    name: "ADR 0004 R11 colour literals"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Checker self-test
        run: python3 conformance/colour/check.py --self-test

      - name: No #RGB / #RRGGBB in shells CSS or Rust
        run: python3 conformance/colour/check.py

  shell-kit-swift:
    name: "shell-kit-swift static boundaries"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Checker self-test
        run: python3 shells/shell-kit-swift/scripts/check.py --self-test

      - name: Vocabulary, imports, colours, and consumers
        run: python3 shells/shell-kit-swift/scripts/check.py
