# Graph check (Phase 0.5, still red: gallery-geo → ureq), Milestone A
# source greps (no FileProvider / MetricKit in production Swift/Go),
# and ADR 0003 R6 (still red: gallery-ffi domain Records).
name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  graph:
    name: "ADR 0002 R13 graph (red: gallery-geo)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/graph/check.py --self-test

      - name: Graph check (expected red)
        run: python3 conformance/graph/check.py --expect-violations gallery-geo

  source:
    name: "Milestone A source greps"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/source/check.py --self-test

      - name: Production Swift/Go APIs
        run: python3 conformance/source/check.py

  r6:
    name: "ADR 0003 R6 surface (red: gallery-ffi Records)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/r6/check.py --self-test

      - name: Display-record check (expected red)
        run: python3 conformance/r6/check.py --expect-violations
