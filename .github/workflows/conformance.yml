# Graph check (ADR 0002 R13, green after localcore-geo), Milestone A
# source greps (no FileProvider / MetricKit in production Swift/Go),
# ADR 0003 R6 (still red: gallery-ffi domain Records), and ADR 0004 R14
# generated-source drift.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  graph:
    name: "ADR 0002 R13 graph"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/graph/check.py --self-test

      - name: Graph check
        run: python3 conformance/graph/check.py

  source:
    name: "Milestone A source greps"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/source/check.py --self-test

      - name: Production Swift/Go APIs
        run: python3 conformance/source/check.py

  r6:
    name: "ADR 0003 R6 surface (gallery-ffi red; contacts-ffi green)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Self-test
        run: python3 conformance/r6/check.py --self-test

      - name: Display-record check (expected red)
        run: python3 conformance/r6/check.py --expect-violations

      - name: contacts-ffi is R6-clean
        run: python3 conformance/r6/check.py --src core/contacts-ffi/src

  r14:
    name: "ADR 0004 R14 generated sources"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Regenerating produces no diff
        run: python3 scripts/gen_r14.py --check
