# Static metric catalogue curated from the retired web UI.
# This is a design/porting reference, not embedded runtime configuration.
#
# Unknown Apple types fall through to domain=other, aggregate=mean, and a
# display name formed by removing the known HealthKit identifier prefix.

# ---------------------------------------------------------------------------
# medicine — clinical events and vitals. Lab and medication kinds join this
# domain with their adapters.
# ---------------------------------------------------------------------------

[HKCategoryTypeIdentifierHeadache]
domain = "medicine"
aggregate = "count"
display = "Headache"

[HKCategoryTypeIdentifierLowHeartRateEvent]
domain = "medicine"
aggregate = "count"
display = "Low heart rate event"

[HKQuantityTypeIdentifierOxygenSaturation]
domain = "medicine"
aggregate = "mean"
display = "Blood oxygen"

[HKQuantityTypeIdentifierRespiratoryRate]
domain = "medicine"
aggregate = "mean"
display = "Respiratory rate"

