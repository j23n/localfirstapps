# Observation and episode kinds, grouped by domain (medicine / lifestyle / sports).
#
# Unknown Apple types fall through: domain=other, daily_aggregate=mean,
# display=the identifier's short name. Unlisted workout types do the same
# until a block is added here.
#
# To add a kind, copy a block and set domain, daily_aggregate, and display.
# Embedded default is this file. Per-archive override:
#   <archive root>/config/kinds.toml

# ---------------------------------------------------------------------------
# medicine — clinical events and vitals. Lab and medication kinds join this
# domain with their adapters.
# ---------------------------------------------------------------------------

[HKCategoryTypeIdentifierHeadache]
domain = "medicine"
daily_aggregate = "count"
display = "Headache"

[HKCategoryTypeIdentifierLowHeartRateEvent]
domain = "medicine"
daily_aggregate = "count"
display = "Low heart rate event"

[HKQuantityTypeIdentifierOxygenSaturation]
domain = "medicine"
daily_aggregate = "mean"
display = "Blood oxygen"

[HKQuantityTypeIdentifierRespiratoryRate]
domain = "medicine"
daily_aggregate = "mean"
display = "Respiratory rate"

