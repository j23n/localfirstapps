{{define "blobs"}}{{template "layout" .}}{{end}}
{{define "content"}}
<h2>Files</h2>
<p class="lead">Imported source files. No preview.</p>
<div class="inset">
<table>
  <thead>
    <tr>
      <th>Kind</th>
      <th>Name</th>
      <th class="num">Size</th>
      <th>Imported</th>
      <th>sha256</th>
    </tr>
  </thead>
  <tbody>
    {{range .Blobs}}
    <tr>
      <td>{{.Kind}}</td>
      <td>{{.Name}}</td>
      <td class="num">{{.Size}}</td>
      <td class="num"><time class="import-ts">{{.TS}}</time></td>
      <td class="mono hash">{{.SHA256}}</td>
    </tr>
    {{end}}
  </tbody>
</table>
</div>
{{end}}
