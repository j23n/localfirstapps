{{define "card"}}
<a class="card hue-{{.Hue}}{{if .Note}} outside {{baseline .Note}}{{end}}" href="{{.Href}}" data-kind="{{.Kind}}">
  <div class="card-head">
    <span class="ico" aria-hidden="true">{{icon .Kind}}</span>
    <span class="k">{{.Display}}</span>
    <div class="v num">{{if .Value}}{{.Value}}{{if .Unit}} <span class="unit">{{.Unit}}</span>{{end}}{{else}}<span class="muted">—</span>{{end}}</div>
    <span class="chev" aria-hidden="true"></span>
  </div>
  {{if .Note}}<div class="note-band">{{.Note}}</div>{{end}}
  {{if .AsOf}}<div class="s">{{.AsOf}}{{if and .Multi .Source}} · {{.Source}}{{end}}</div>
  {{else if and .Multi .Source}}<div class="s">{{.Source}}</div>{{end}}
</a>
{{end}}
