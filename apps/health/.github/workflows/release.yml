name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CGO_ENABLED: "1"
  GOFLAGS: "-mod=vendor"

jobs:
  changelog:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: require CHANGELOG.md section for this tag
        run: ./scripts/changelog-notes.sh "${{ github.ref_name }}" > "${{ runner.temp }}/notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: archive-darwin-arm64
          - os: ubuntu-26.04
            artifact: archive-linux-amd64
          - os: ubuntu-26.04-arm
            artifact: archive-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: build
        run: go build -o "${{ matrix.artifact }}" ./cmd/archive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: [changelog, build]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: checksums and notes
        run: |
          ./scripts/changelog-notes.sh "${{ github.ref_name }}" > notes.md
          (cd dist && sha256sum archive-* > SHA256SUMS)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            dist/archive-darwin-arm64 \
            dist/archive-linux-amd64 \
            dist/archive-linux-arm64 \
            dist/SHA256SUMS
