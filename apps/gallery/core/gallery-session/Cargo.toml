[package]
name = "gallery-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Host policy shared by iOS and Linux: analysis, packs, places run, watch mute"

[features]
default = []
ml = ["gallery-ml/ort-backend"]

[dependencies]
gallery-meta = { path = "../gallery-meta" }
localcore-geo = { path = "../localcore-geo" }
localcore-queue = { path = "../../../../core/localcore-queue" }
localcore-trace = { path = "../../../../core/localcore-trace" }
gallery-ml = { path = "../gallery-ml", default-features = false }
gallery-model = { path = "../gallery-model" }
gallery-vfs = { path = "../gallery-vfs" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
