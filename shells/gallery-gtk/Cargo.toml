[package]
name = "gallery-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "LocalGallery GTK shell — year rail + 5.9 close-out"

[lib]
name = "gallery_gtk"
path = "src/lib.rs"

[[bin]]
name = "localgallery"
path = "src/main.rs"

[features]
default = ["ml"]
# ONNX Runtime. Leftover `ui` stays off so kit GTK 0.11 is the only UI
# in this graph. `cargo test --all-features` in `shells/` downloads `ort`.
ml = ["gallery-ffi/ml", "localgallery/ml"]

[dependencies]
shell-kit-gtk = { path = "../shell-kit-gtk" }
# View models. Default `ml` turns `gallery-ffi/ml` back on. Do not
# relax the Gallery `image` / `uniffi` pins.
gallery-ffi = { path = "../../apps/gallery/core/gallery-ffi", default-features = false }
contacts-core = { path = "../../core/contacts-core" }
# Host only (config, XDG thumbs, folder watch, scan/ops). Leftover GTK
# stays off — leftover `ui` must not enter this graph.
localgallery = { path = "../../apps/gallery/linux", default-features = false }
gallery-vfs = { path = "../../apps/gallery/core/gallery-vfs" }
gallery-model = { path = "../../apps/gallery/core/gallery-model" }
gallery-meta = { path = "../../apps/gallery/core/gallery-meta" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
pango = { version = "0.22", features = ["v1_56"] }
localcore-ui = { path = "../../core/localcore-ui" }
localcore-trace = { path = "../../core/localcore-trace", features = ["subscriber"] }
