[package]
name = "gallery-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "LocalGallery GTK shell — pin crate; kit UI is Phase 5.5"

[lib]
name = "gallery_gtk"
path = "src/lib.rs"

# `ml` is not a crate feature yet. Phase 5.5 can add
# `ml = ["gallery-ffi/ml", "localgallery/ml"]` when Scan Photos needs
# ONNX. Until then `cargo test --all-features` in `shells/` must not
# download `ort` or need `openssl.pc`.

[dependencies]
# View models. `default-features = false` drops `gallery-ffi`'s `ml`
# (ONNX Runtime). Do not relax the Gallery `image` / `uniffi` pins.
gallery-ffi = { path = "../../apps/gallery/core/gallery-ffi", default-features = false }
# Host only (config, XDG thumbs, folder watch, scan/ops). Leftover GTK
# stays off — `ui` is leftover's default and must not enter this graph.
localgallery = { path = "../../apps/gallery/linux", default-features = false }
