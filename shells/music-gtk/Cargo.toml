[package]
name = "music-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "LocalMusic GTK shell — laptop and Mecha Comet"

[[bin]]
name = "localmusic"
path = "src/main.rs"

[features]
default = []
gstreamer-playback = ["dep:gstreamer"]

[dependencies]
shell-kit-gtk = { path = "../shell-kit-gtk" }
music-core = { path = "../../core/music-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
gstreamer = { version = "0.22", optional = true }
lofty = "0.22"
localcore-trace = { path = "../../core/localcore-trace", features = ["subscriber"] }

[dev-dependencies]
contacts-gtk = { path = "../contacts-gtk" }
gallery-gtk = { path = "../gallery-gtk" }
