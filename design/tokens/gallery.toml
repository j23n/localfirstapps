# Gallery token table (ADR 0004 R11). Light-only until Phase 3.5.
# Surfaces and ink are the values that were in Design.swift. Accent
# is the light component of AccentColor.colorset.

app = "gallery"

[colors.accent]
light = "#C48A3E"

[colors.bg]
light = "#FAF7F2"

[colors.bg_card]
light = "#FFFFFF"

[colors.bg_grouped]
light = "#F2EDE5"

[colors.ink]
light = "#1C1A16"

[colors.ink2]
light = "#5E574D"

[colors.ink3]
light = "#958D82"

[colors.destructive]
light = "#B24A3A"

[colors.separator_ink]
light = "#3C372D"

[metrics]
card_radius = 14
memory_radius = 20
separator_opacity = 0.10
accent_soft_opacity = 0.13
